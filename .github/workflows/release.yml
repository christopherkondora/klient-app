name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  AZURE_CODE_SIGNING_ENDPOINT: https://weu.codesigning.azure.net/
  AZURE_CODE_SIGNING_PUBLISHER_NAME: Klient

jobs:
  release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 480
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import Apple signing certificate
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/apple-signing-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/klient-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$CSC_KEY_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$CSC_KEY_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CSC_KEY_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build app (macOS)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: npm run build

      - name: Sign, notarize and publish (macOS)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 420
        env:
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE_TIMEOUT_MINUTES: 360
          NOTARIZE_POLL_INTERVAL_SECONDS: 60
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
        run: npx electron-builder --mac --publish always -c electron-builder.config.cjs

      - name: Cleanup Apple keychain
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${APPLE_KEYCHAIN_PATH:-}" ] && [ -f "$APPLE_KEYCHAIN_PATH" ]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH"
          fi

      - name: Install Trusted Signing module
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction Ignore)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser
          }
          Install-Module -Name TrustedSigning -Force -AllowClobber -Scope CurrentUser
          Import-Module TrustedSigning
          Get-Command Invoke-TrustedSigning

      - name: Validate Azure Trusted Signing config
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_CODE_SIGNING_ENDPOINT) -or $env:AZURE_CODE_SIGNING_ENDPOINT -eq '__SET_AZURE_CODE_SIGNING_ENDPOINT__') {
            throw "Set AZURE_CODE_SIGNING_ENDPOINT in .github/workflows/release.yml to your Artifact Signing regional endpoint, for example https://weu.codesigning.azure.net/"
          }

      - name: Build, sign and publish (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ env.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_PUBLISHER_NAME: ${{ env.AZURE_CODE_SIGNING_PUBLISHER_NAME }}
        run: npm run build && npx electron-builder --win --publish always -c electron-builder.config.cjs
