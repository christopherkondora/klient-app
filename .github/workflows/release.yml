name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  AZURE_CODE_SIGNING_ENDPOINT: https://weu.codesigning.azure.net/
  AZURE_CODE_SIGNING_PUBLISHER_NAME: CN=Kondora Kristóf Máté Egyéni Vállalkozó, O=Kondora Kristóf Máté Egyéni Vállalkozó, L=Ják, S=Vas, C=HU

jobs:
  release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 480
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app (macOS)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 15
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: npm run build

      - name: Sign, notarize and publish (macOS)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 420
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE_TIMEOUT_MINUTES: 360
          NOTARIZE_POLL_INTERVAL_SECONDS: 60
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
        run: npx electron-builder --mac --publish always -c electron-builder.config.cjs

      - name: Install Trusted Signing module
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-PackageProvider -Name NuGet -ErrorAction Ignore)) {
            Install-PackageProvider -Name NuGet -Force -Scope CurrentUser
          }
          Install-Module -Name TrustedSigning -Force -AllowClobber -Scope CurrentUser
          Import-Module TrustedSigning
          Get-Command Invoke-TrustedSigning

      - name: Validate Azure Trusted Signing config
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: |
          $required = @(
            'AZURE_CODE_SIGNING_ENDPOINT',
            'AZURE_CODE_SIGNING_PUBLISHER_NAME',
            'AZURE_TENANT_ID',
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_CODE_SIGNING_ACCOUNT_NAME',
            'AZURE_CERTIFICATE_PROFILE_NAME'
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value) -or $value.StartsWith('__SET_')) {
              throw "Missing Azure Trusted Signing configuration: $name"
            }
          }

      - name: Build, sign and publish (Windows)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ env.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_PUBLISHER_NAME: ${{ env.AZURE_CODE_SIGNING_PUBLISHER_NAME }}
        run: npm run build && npx electron-builder --win --publish always -c electron-builder.config.cjs
